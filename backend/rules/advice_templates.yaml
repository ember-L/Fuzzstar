# 初筛建议模板（按状态档降级用；T10）。文案禁「确诊」「治疗」字样。
version: at-2026-11-19
states:
  normal:
    text: 本次初筛未发现明显异常,精神与食欲在正常范围,继续保持日常观察即可。
    tips:
      - 保持规律喂食、饮水与玩耍
      - 每日留意精神、食欲与排泄变化
      - 出现新症状时及时再做一次初筛
  observe:
    text: 本次初筛提示轻度异常,建议先居家观察并记录变化;若 24–48 小时内无改善或加重,请复查或咨询兽医。
    tips:
      - 观察并记录精神、食欲与症状变化(频次/时长)
      - 拍照或录像留存症状证据
      - 保证饮水与安静休息,避免应激
      - 无改善或加重时及时复查或就医
  vet:
    text: 本次初筛提示需要专业评估,建议尽快安排兽医面诊;以下建议仅供记录与就医准备参考。
    tips:
      - 尽快预约兽医门诊,说明症状起始时间与变化
      - 带上本条初筛记录与存证照片/视频
      - 就诊前记录症状频次、饮食与排泄情况
      - 遵循兽医的检查与护理安排,勿自行用药
  urgent:
    text: 本次初筛命中紧急信号,请立即前往具备急诊能力的宠物医院,不要等待观察。
    tips:
      - 带上本条记录与存证照片/视频
      - 出发前电话确认医院急诊能力
      - 疑似中毒请携带可疑物品包装,勿自行催吐
      - 勿擅自喂食人用药物
