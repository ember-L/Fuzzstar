# 萌宠动图（FRD F14）：动作集、健康与手势映射、生成规格。版本化下发，改配置不改客户端。
# 规格硬约束：单条 GIF ≤7s、高 480、12fps、循环；服务端逐条校验，超限记该动作失败。
version: mo-2026-11-21
max_seconds: 7
fps: 12
height: 480
min_ready: 8
standby: idle
style_prompt: 将这张猫咪照片转为萌系卡通形象，保留毛色、花纹与体态特征，圆眼短腿、纯色浅底、正面全身。
actions: [idle, happy, play, stretch, yawn, groom, sleep, alert, sad, sick, look_left, look_right]
prompts:
  idle: idle 待机：轻呼吸、慢眨眼，身体小幅起伏，首尾帧对齐可无缝循环
  happy: happy 开心：尾巴左右摆动，轻快小跳
  play: play 玩耍：前爪扑动，追着自己的尾巴转半圈
  stretch: stretch 伸懒腰：前身压低、后身抬高，拉长身体再回正
  yawn: yawn 打哈欠：张大嘴，闭眼仰头，缓慢回正
  groom: groom 洗脸：低头，前爪贴近脸侧擦拭
  sleep: sleep 睡觉：趴卧闭眼，呼吸慢而深
  alert: alert 警觉：耳朵竖起，抬头张望，身体绷紧
  sad: sad 难过：低头垂耳，缓慢蜷缩
  sick: sick 不适：精神萎靡，半闭眼趴卧少动
  look_left: look_left 左看：头部转向左侧再回正
  look_right: look_right 右看：头部转向右侧再回正
health:
  normal: idle
  observe: alert
  vet: sick
  urgent: sick
gestures:
  tap:
    actions: [happy, play]
    replies: [蹭了蹭你的手，尾巴翘起来了。, 扑了个空，又假装什么都没发生。]
  long_press:
    actions: [groom, stretch, yawn]
    replies: [被摸得很舒服，开始认真洗脸。, 伸了个长长的懒腰。, 打了个哈欠，眼睛都眯起来了。]
  swipe_left:
    actions: [look_left]
    replies: [扭头看向左边。]
  swipe_right:
    actions: [look_right]
    replies: [扭头看向右边。]
emotions:
  happy: happy
  relaxed: idle
  annoyed: alert
  fearful: sad
  painful: sick
  seeking_attention: [look_left, look_right]
labels:
  idle: 待机
  happy: 开心
  play: 玩耍
  stretch: 伸懒腰
  yawn: 打哈欠
  groom: 洗脸
  sleep: 睡觉
  alert: 警觉
  sad: 难过
  sick: 不适
  look_left: 向左看
  look_right: 向右看
status_labels:
  normal: 精神不错
  observe: 在观察
  vet: 建议就医
  urgent: 建议立即就医
